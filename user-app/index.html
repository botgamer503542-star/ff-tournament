<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07070b">
<link rel="manifest" href="manifest.json">
<title>FF Battle Zone</title>
<style>
:root{--bg:#07070b;--card:#111118;--card2:#1a1a24;--line:#262634;--text:#f5f5f7;--muted:#9ca3af;--red:#ff2a3d;--red2:#b3121f;--gold:#facc15;--green:#22c55e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans Bengali",sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding-bottom:92px}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
input{width:100%;padding:13px;margin:4px 0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;font-family:inherit}
input:focus{outline:none;border-color:var(--red)}
label{display:block;font-size:13px;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.err{padding:14px;border-radius:12px;background:#2a0f13;color:#fecaca;font-size:14px}
.loader{margin:40px auto;width:34px;height:34px;border-radius:50%;border:3px solid var(--card2);border-top-color:var(--red);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{display:block;width:100%;padding:13px;border:1px solid #2a2a38;border-radius:12px;font-weight:800;font-size:14px;color:#fff;background:var(--card2);cursor:pointer;font-family:inherit}
.btn.red{background:linear-gradient(135deg,#ff1f36,var(--red2));border:none}
.btn:disabled{background:#1f1f2b;color:#6b7280;border-color:#1f1f2b;cursor:not-allowed}

#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at top,#3a0a10 0%,var(--bg) 60%)}
.auth-wrap{width:100%;max-width:380px;text-align:center}
.alogo{width:82px;height:82px;border-radius:22px;box-shadow:0 12px 30px rgba(255,42,61,.35)}
.auth-wrap h1{margin:12px 0 14px;font-size:24px;letter-spacing:1px}
.auth-wrap h1 b{color:var(--red)}
.authcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:left}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);padding:4px;border-radius:12px;margin-bottom:12px}
.seg button{padding:10px;border:none;border-radius:10px;background:transparent;color:var(--muted);font-weight:700;font-family:inherit}
.seg button.on{background:var(--red);color:#fff}
.msg{min-height:20px;margin-top:10px;color:var(--gold);font-size:14px;text-align:center}

.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:rgba(7,7,11,.95);border-bottom:1px solid #1f1f2b}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;letter-spacing:.5px}
.brand img{width:34px;height:34px;border-radius:9px}
.brand b{color:var(--red)}
.top-r{display:flex;gap:8px;align-items:center}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid #262634;background:#13131b;color:#fff;font-size:17px;display:inline-flex;align-items:center;justify-content:center}
.wchip{padding:8px 12px;border-radius:999px;background:#13131b;border:1px solid #2a2a38;color:var(--gold);font-weight:800;font-size:14px}

main{padding:14px}
.view{display:none}
.view.on{display:block}

.hero{position:relative;width:100%;aspect-ratio:12/5;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#3a0a10,#0d0d13)}
.slides{display:flex;width:100%;height:100%;transition:transform .5s ease}
.slide{flex:0 0 100%;height:100%}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.35);transition:.3s}
.dots i.on{width:20px;background:var(--red)}
.ann{display:flex;align-items:center;gap:10px;margin:14px 0;padding:11px 14px;border-radius:14px;background:#140a0c;border:1px solid #4a1218;overflow:hidden}
.marq{flex:1;white-space:nowrap;overflow:hidden;font-size:14px;color:#ffd1d6}
.marq span{display:inline-block;animation:mq 16s linear infinite}
@keyframes mq{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
.sec{margin:18px 0 10px;font-size:17px;font-weight:800}

.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cc{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:0;color:var(--text);text-align:left;font-family:inherit;transition:transform .15s}
.cc:active{transform:scale(.98)}
.cimg{height:118px;background:linear-gradient(135deg,var(--red2),#120508)}
.cimg img{width:100%;height:100%;object-fit:cover;display:block}
.cn{padding:10px 12px 2px;font-weight:800;font-size:15px}
.cm{padding:0 12px 12px;font-size:12px;color:#ff6b78}

.cathead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cathead h2{margin:0;font-size:18px}
.mc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px}
.mc-top{display:flex;gap:12px;align-items:center}
.mthumb{width:74px;height:74px;border-radius:14px;flex:0 0 auto;overflow:hidden;background:linear-gradient(135deg,var(--red2),#120508)}
.mthumb img{width:100%;height:100%;object-fit:cover;display:block}
.mtitle{flex:1;min-width:0;padding-right:70px}
.mtitle h4{margin:0 0 4px;font-size:15px;line-height:1.3}
.mtime{font-size:15px;font-weight:800;color:#ff5a6a}
.badge{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;letter-spacing:.5px;color:#fff}
.badge.up{background:#16a34a}
.badge.live{background:#ef4444}
.badge.full{background:#64748b}
.badge.closed{background:#334155}
.badge.joined{background:var(--red)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.s3{background:var(--card2);border-radius:12px;padding:9px 4px;text-align:center}
.s3 small{display:block;font-size:10px;color:var(--muted);letter-spacing:.4px}
.s3 b{font-size:14px}
.gold{color:var(--gold)}
.pink{color:#ff5a6a}
.tags{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
.tags span{background:var(--card2);border-radius:8px;padding:5px 8px}
.bar{height:6px;background:#1f1f2b;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff1f36,#ff7a59)}
.note-left{font-size:12px;color:#ff5a6a;margin:6px 0 10px;min-height:14px}
.count{margin-bottom:10px;background:var(--card2);border-radius:12px;padding:9px;text-align:center;font-size:13px;color:var(--muted)}
.count b{color:var(--red);font-size:15px}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbtns .full{grid-column:1/-1}
.roombox{margin-top:10px;background:var(--card2);border-radius:12px;padding:11px;font-size:15px;line-height:1.7}
.roombox b{color:#67e8f9}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tab{padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:700;font-family:inherit}
.tab.on{background:var(--red);border-color:var(--red);color:#fff}

.prof{text-align:center;padding:10px 0 16px}
.pav{width:84px;height:84px;margin:0 auto 10px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--red2));display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900}
.wcard{background:linear-gradient(135deg,#7f1d1d,#0f0f16 70%);border:1px solid #3a1217;border-radius:20px;padding:20px}
.wcard small{color:var(--muted);letter-spacing:.5px;font-size:12px}
.wcard h2{margin:6px 0 14px;font-size:34px;color:var(--gold)}
.wrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wrow div{background:rgba(0,0,0,.3);border-radius:12px;padding:10px}
.wrow b{font-size:16px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.hrow{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;font-size:14px;gap:8px}
.hrow small{color:var(--muted)}
.amt{font-weight:800}
.amt.pos{color:var(--green)}
.amt.neg{color:#f87171}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:#2a2a38;margin-top:4px}
.pill.pending{background:#f59e0b;color:#111}
.pill.approved,.pill.paid{background:var(--green);color:#fff}
.pill.rejected{background:var(--red);color:#fff}
.soon{text-align:center;padding:60px 10px}

.bnav{position:fixed;left:10px;right:10px;bottom:10px;z-index:30;display:flex;background:#0d0d13;border:1px solid var(--line);border-radius:20px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.6)}
.bnav button{flex:1;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:8px 0;border-radius:14px;font-family:inherit}
.bnav button i{font-style:normal;font-size:19px}
.bnav button.on{color:#fff;background:rgba(255,42,61,.18)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:#0d0d13;border-top:1px solid #3a1217;border-radius:22px 22px 0 0;padding:18px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh h3{margin:0;font-size:17px}
.sx{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:#fff;font-size:15px}
.sfoot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.sfoot .btn:only-child{grid-column:1/-1}
.sumrow{display:flex;justify-content:space-between;background:var(--card2);border-radius:12px;padding:12px;margin:12px 0;font-weight:700}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.seg3 button{padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:700;font-family:inherit}
.seg3 button.on{background:var(--red);border-color:var(--red);color:#fff}
.note{background:var(--card2);border-radius:12px;padding:11px;font-size:13px;line-height:1.6;margin-bottom:10px}
.prz div{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.prz b{float:right}

.toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:92%;max-width:420px;z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--card2);border-left:4px solid var(--red);padding:12px 14px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.5);opacity:0;transform:translateY(-8px);transition:.25s}
.toast.show{opacity:1;transform:none}
.toast.success{border-color:var(--green)}
.toast.error{border-color:#ef4444}
</style>
</head>
<body>

<section id="auth" class="hidden">
  <div class="auth-wrap">
    <img class="alogo" src="icon-192.png" alt="" onerror="this.remove()">
    <h1>FF <b>BATTLE ZONE</b></h1>
    <div class="authcard">
      <div class="seg">
        <button id="sLogin" class="on" data-act="authTab" data-id="login">লগইন</button>
        <button id="sReg" data-act="authTab" data-id="reg">রেজিস্ট্রেশন</button>
      </div>
      <div id="fLogin">
        <label>ফোন নম্বর</label><input id="lPhone" inputmode="tel">
        <label>পাসওয়ার্ড</label><input id="lPass" type="password">
        <button class="btn red" data-act="login">লগইন করুন</button>
      </div>
      <div id="fReg" class="hidden">
        <label>আপনার নাম</label><input id="rName">
        <label>Free Fire UID</label><input id="rFF" inputmode="numeric">
        <label>ফোন নম্বর</label><input id="rPhone" inputmode="tel">
        <label>পাসওয়ার্ড (কমপক্ষে ৪ অক্ষর)</label><input id="rPass" type="password">
        <label>পাসওয়ার্ড আবার লিখুন</label><input id="rPass2" type="password">
        <button class="btn red" data-act="register">অ্যাকাউন্ট খুলুন</button>
      </div>
      <div class="msg" id="authMsg"></div>
    </div>
  </div>
</section>

<div id="app" class="hidden">
  <header class="top">
    <div class="brand"><img src="icon-192.png" alt="" onerror="this.style.display='none'"><span id="brand">FF <b>BATTLE ZONE</b></span></div>
    <div class="top-r">
      <button class="ib" data-act="soon" title="নোটিফিকেশন">🔔</button>
      <button class="ib" data-act="soon" title="ফলাফল">🏆</button>
      <button class="wchip" id="wChip" data-act="go" data-id="profile">৳ 0</button>
    </div>
  </header>

  <main>
    <section class="view" id="v-home">
      <div class="hero">
        <div class="slides" id="slides"></div>
        <div class="dots" id="dots"></div>
      </div>
      <div class="ann"><span>📢</span><div class="marq"><span id="annText"></span></div></div>
      <div class="sec">ক্যাটাগরি</div>
      <div class="cgrid" id="cgrid"></div>
    </section>

    <section class="view" id="v-cat">
      <div class="cathead"><button class="ib" data-act="go" data-id="home">←</button><h2 id="catTitle"></h2></div>
      <div id="catList"></div>
    </section>

    <section class="view" id="v-matches">
      <div class="tabs">
        <button class="tab on" data-act="mtab" data-id="up">আপকামিং</button>
        <button class="tab" data-act="mtab" data-id="all">সব ম্যাচ</button>
      </div>
      <div id="myList"></div>
    </section>

    <section class="view" id="v-shop">
      <div class="soon">
        <div style="font-size:52px">🛒</div>
        <h3>শপ শীঘ্রই আসছে</h3>
        <p class="muted">ডায়মন্ড প্যাকেজ ও অফার খুব শীঘ্রই যুক্ত হবে।</p>
      </div>
    </section>

    <section class="view" id="v-profile">
      <div class="prof">
        <div class="pav" id="pav">?</div>
        <h3 id="pName" style="margin:0 0 4px"></h3>
        <p class="muted">FF Battle Zone খেলোয়াড়</p>
      </div>
      <div class="wcard">
        <small>TOTAL BALANCE</small>
        <h2 id="wBal">৳ 0</h2>
        <div class="wrow">
          <div><small>অনুমোদিত ডিপোজিট</small><br><b id="wDep">৳ 0</b></div>
          <div><small>ওয়ালেট</small><br><b>RX ক্যাশ</b></div>
        </div>
      </div>
      <div class="btnrow">
        <button class="btn" style="background:linear-gradient(135deg,#059669,#22c55e);border:none" data-act="deposit">+ Add Money</button>
        <button class="btn red" data-act="withdraw">− Withdraw</button>
      </div>
      <h3 style="margin:18px 0 10px;font-size:16px">লেনদেনের ইতিহাস</h3>
      <div id="hist"></div>
      <button class="btn" style="margin-top:14px" data-act="logout">লগআউট</button>
    </section>
  </main>

  <nav class="bnav" id="nav">
    <button class="on" data-act="go" data-id="home"><i>🏠</i>হোম</button>
    <button data-act="go" data-id="matches"><i>🎯</i>আমার ম্যাচ</button>
    <button data-act="go" data-id="shop"><i>🛒</i>শপ</button>
    <button data-act="go" data-id="profile"><i>👤</i>প্রোফাইল</button>
  </nav>
</div>

<div class="modal hidden" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="sheet">
    <div class="sh"><h3 id="sheetTitle"></h3><button class="sx" data-act="close">✕</button></div>
    <div id="sheetBody"></div>
    <div class="sfoot" id="sheetFoot"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
const API = 'https://production-o2k8.onrender.com';
const $ = id => document.getElementById(id);

let token = localStorage.getItem('token') || '';
let userName = localStorage.getItem('userName') || '';
let SETTINGS = {};
let CATS = [];
let ALL = [];
let MY = [];
const S = { view: 'home', cat: '', mtab: 'up', dM: 'bkash', wM: 'bkash', heroIdx: 0, heroTimer: null };
const METHOD = { bkash: 'bKash', nagad: 'Nagad', rocket: 'Rocket' };
const STATUS_BN = { pending: 'অপেক্ষমাণ', approved: 'অনুমোদিত', paid: 'পরিশোধিত', rejected: 'বাতিল' };

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function money(n) { return '৳ ' + (Number(n) || 0).toLocaleString('en-US'); }
function loader() { return '<div class="loader"></div>'; }
function empty(icon, text) { return `<div class="empty"><div style="font-size:40px">${icon}</div>${esc(text)}</div>`; }
function errBox(t) { return `<div class="err">${esc(t)}</div>`; }
function isAuthErr(m) { return /অনুমতি|মেয়াদ|ব্যান/.test(m || ''); }

function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('toasts').appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 3000);
}

function cleanTime(s) { return s ? String(s).replace('Z', '').replace('T', ' ').slice(0, 16) : ''; }
function localDate(c) {
  const [d, t] = c.split(' ');
  const [y, m, dd] = d.split('-').map(Number);
  const [hh, mm] = t.split(':').map(Number);
  return new Date(y, m - 1, dd, hh, mm);
}
function fmtDT(c) { return localDate(c).toLocaleString('bn-BD', { dateStyle: 'medium', timeStyle: 'short' }); }
function fmtLeft(ms) {
  if (ms <= 0) return 'শুরু হয়েছে';
  const s = Math.floor(ms / 1000);
  const p = n => String(n).padStart(2, '0');
  return `${p(Math.floor(s / 3600))}ঘ ${p(Math.floor((s % 3600) / 60))}মি ${p(s % 60)}সে`;
}
setInterval(() => {
  document.querySelectorAll('[data-start]').forEach(el => {
    el.textContent = fmtLeft(localDate(el.dataset.start) - Date.now());
  });
}, 1000);

async function api(path, opts = {}, tries = 2) {
  for (let i = 1; i <= tries; i++) {
    try {
      const res = await fetch(API + path, {
        cache: 'no-store', ...opts,
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { Authorization: 'Bearer ' + token } : {}),
          ...(opts.headers || {}),
        },
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'সমস্যা হয়েছে (' + res.status + ')');
      return data;
    } catch (e) {
      if (e instanceof TypeError) {
        if (i < tries) { await new Promise(r => setTimeout(r, 6000)); continue; }
        throw new Error('সার্ভারে পৌঁছানো যাচ্ছে না। ১ মিনিট পর আবার চেষ্টা করুন।');
      }
      throw e;
    }
  }
}

function imgTag(src) { return `<img src="${esc(src)}" alt="" onerror="this.remove()">`; }
function catImg(slug) {
  const k = 'banner_' + String(slug).replace(/-/g, '_');
  return SETTINGS[k] || './' + slug + '.jpg';
}
function thumbOf(t) { return t.image_url || catImg(t.category_slug || 'home'); }

function openModal(title, body, foot) {
  $('sheetTitle').textContent = title;
  $('sheetBody').innerHTML = body;
  $('sheetFoot').innerHTML = foot || '';
  $('modal').classList.remove('hidden');
}
function closeModal() { $('modal').classList.add('hidden'); }

function showAuth(which) {
  const login = which === 'login';
  $('fLogin').classList.toggle('hidden', !login);
  $('fReg').classList.toggle('hidden', login);
  $('sLogin').classList.toggle('on', login);
  $('sReg').classList.toggle('on', !login);
  $('authMsg').textContent = '';
}

async function login() {
  $('authMsg').textContent = 'লগইন হচ্ছে...';
  try {
    const d = await api('/api/login', {
      method: 'POST',
      body: JSON.stringify({ phone: $('lPhone').value, password: $('lPass').value }),
    });
    token = d.token;
    userName = d.user.name;
    localStorage.setItem('token', token);
    localStorage.setItem('userName', userName);
    $('auth').classList.add('hidden');
    $('app').classList.remove('hidden');
    history.replaceState({ v: 'home', cat: '' }, '');
    showView('home', false);
    loadWallet();
    toast('স্বাগতম, ' + userName + '!', 'success');
  } catch (e) { $('authMsg').textContent = e.message; }
}

async function register() {
  if ($('rPass').value !== $('rPass2').value) { $('authMsg').textContent = 'দুটো পাসওয়ার্ড মিলছে না'; return; }
  $('authMsg').textContent = 'অ্যাকাউন্ট খোলা হচ্ছে...';
  try {
    await api('/api/register', {
      method: 'POST',
      body: JSON.stringify({
        name: $('rName').value, ff_id: $('rFF').value,
        phone: $('rPhone').value, password: $('rPass').value,
      }),
    });
    showAuth('login');
    $('authMsg').textContent = 'অ্যাকাউন্ট তৈরি হয়েছে, এখন লগইন করুন';
  } catch (e) { $('authMsg').textContent = e.message; }
}

function logout(msg) {
  token = '';
  localStorage.removeItem('token');
  localStorage.removeItem('userName');
  if (msg) sessionStorage.setItem('flash', msg);
  location.reload();
}

function showView(v, push) {
  if (!token) return;
  if (push && (v !== S.view || v === 'cat')) history.pushState({ v, cat: S.cat }, '');
  S.view = v;
  document.querySelectorAll('.view').forEach(x => x.classList.toggle('on', x.id === 'v-' + v));
  const nav = v === 'cat' ? 'home' : v;
  document.querySelectorAll('.bnav button').forEach(b => b.classList.toggle('on', b.dataset.id === nav));
  window.scrollTo(0, 0);
  if (v === 'home') loadHome();
  if (v === 'cat') loadCat();
  if (v === 'matches') loadMy();
  if (v === 'profile') loadProfile();
}

window.addEventListener('popstate', e => {
  if (!$('modal').classList.contains('hidden')) { closeModal(); return; }
  const st = e.state || {};
  if (st.cat !== undefined) S.cat = st.cat;
  showView(st.v || 'home', false);
});

function renderHero() {
  const urls = [SETTINGS.banner_home || './home.jpg', catImg('br-solo'), catImg('lone-wolf'), catImg('cs-2v2')];
  $('slides').innerHTML = urls.map(u => `<div class="slide">${imgTag(u)}</div>`).join('');
  $('slides').style.transform = 'translateX(0)';
  $('dots').innerHTML = urls.map((_, i) => `<i class="${i === 0 ? 'on' : ''}"></i>`).join('');
  $('annText').textContent = SETTINGS.welcome_text || 'স্বাগতম FF Battle Zone-এ! টুর্নামেন্টে জয়েন করুন এবং প্রাইজ জিতুন';
  clearInterval(S.heroTimer);
  S.heroIdx = 0;
  if (urls.length > 1) {
    S.heroTimer = setInterval(() => {
      S.heroIdx = (S.heroIdx + 1) % urls.length;
      $('slides').style.transform = `translateX(-${S.heroIdx * 100}%)`;
      document.querySelectorAll('#dots i').forEach((d, k) => d.classList.toggle('on', k === S.heroIdx));
    }, 4000);
  }
}

async function loadHome() {
  renderHero();
  $('cgrid').innerHTML = loader();
  try {
    const [c, a] = await Promise.all([api('/api/categories'), api('/api/tournaments')]);
    CATS = c;
    ALL = a;
  } catch (e) {
    $('cgrid').innerHTML = errBox(e.message);
    if (isAuthErr(e.message)) logout(e.message);
    return;
  }
  $('cgrid').innerHTML = CATS.map(c => {
    const n = ALL.filter(t => t.category_slug === c.slug).length;
    return `<button class="cc" data-act="openCat" data-id="${esc(c.slug)}">
      <div class="cimg">${imgTag(catImg(c.slug))}</div>
      <div class="cn">${esc(c.name)}</div>
      <div class="cm">${n} matches found</div>
    </button>`;
  }).join('') || empty('🎮', 'এখনো কোনো ক্যাটাগরি নেই');
}

function matchCard(t) {
  const id = Number(t.id);
  const clean = cleanTime(t.starts_at);
  const start = clean ? localDate(clean) : null;
  const past = start && start < new Date();
  const when = clean ? fmtDT(clean) : 'সময় ঘোষণা হবে';

  let cls, label;
  if (t.is_joined) { cls = 'joined'; label = 'JOINED'; }
  else if (t.status === 'closed') { cls = 'closed'; label = 'CLOSED'; }
  else if (Number(t.available) <= 0) { cls = 'full'; label = 'FULL'; }
  else if (past) { cls = 'live'; label = 'LIVE'; }
  else { cls = 'up'; label = 'UPCOMING'; }

  const joined = Number(t.joined) || 0;
  const max = Number(t.max_slots) || 1;
  const pct = Math.min(100, Math.round((joined / max) * 100));
  const note = !t.is_joined && Number(t.available) > 0 && Number(t.available) <= 5
    ? `Only ${t.available} spots left` : '';

  const joinBtn = t.is_joined
    ? `<button class="btn" disabled>✓ জয়েন হয়েছে</button>`
    : cls === 'up'
      ? `<button class="btn red" data-act="join" data-id="${id}">JOIN NOW</button>`
      : `<button class="btn" disabled>${label}</button>`;
  const roomBtn = t.is_joined ? `<button class="btn" data-act="room" data-id="${id}">Room ID</button>` : '';

  return `
    <div class="mc">
      <span class="badge ${cls}">${label}</span>
      <div class="mc-top">
        <div class="mthumb">${imgTag(thumbOf(t))}</div>
        <div class="mtitle">
          <h4>${esc(t.name)}</h4>
          <div class="mtime">${esc(when)}</div>
        </div>
      </div>
      <div class="stats3">
        <div class="s3"><small>PRIZE POOL</small><b class="gold">${esc(t.prize || '-')}</b></div>
        <div class="s3"><small>PER KILL</small><b class="gold">${money(t.per_kill)}</b></div>
        <div class="s3"><small>ENTRY FEE</small><b class="pink">${money(t.entry_fee)}</b></div>
      </div>
      <div class="tags">
        <span>${esc(t.match_type || '-')}</span>
        <span>🗺️ ${esc(t.map_name || '-')}</span>
        <span>👥 ${joined}/${max}</span>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="note-left">${esc(note)}</div>
      ${clean && !past ? `<div class="count">STARTS IN <b data-start="${esc(clean)}"></b></div>` : ''}
      <div class="mbtns">
        <div class="full">${joinBtn}</div>
        ${roomBtn}
        <button class="btn" data-act="prize" data-id="${id}">Prize Pool</button>
      </div>
    </div>`;
}

async function loadCat() {
  const c = CATS.find(x => x.slug === S.cat);
  $('catTitle').textContent = c ? c.name : 'ম্যাচ';
  $('catList').innerHTML = loader();
  try {
    if (!ALL.length) ALL = await api('/api/tournaments');
  } catch (e) {
    $('catList').innerHTML = errBox(e.message);
    if (isAuthErr(e.message)) logout(e.message);
    return;
  }
  renderCat();
}

function renderCat() {
  const list = ALL.filter(t => t.category_slug === S.cat);
  $('catList').innerHTML = list.map(matchCard).join('') || empty('🎯', 'এই ক্যাটাগরিতে এখন কোনো ম্যাচ নেই');
}

function openJoin(id) {
  const t = ALL.find(x => Number(x.id) === Number(id));
  if (!t) return;
  const fee = Number(t.entry_fee) || 0;
  const saved = localStorage.getItem('ffName') || '';
  openModal('MATCH এ জয়েন করুন', `
    <div class="note">
      <b style="font-size:15px">🎮 ${esc(t.name)}</b>
      <div class="muted" style="margin-top:4px">${esc(t.match_type || '')} · ${esc(t.map_name || '')} · ENTRY: ${money(fee)}</div>
    </div>
    <label>আপনার FREE FIRE আইডির নাম লিখুন</label>
    <input id="jName" maxlength="30" value="${esc(saved)}" placeholder="যেমন: Xyclone">
    <div class="sumrow"><span>মোট খরচ (1 জন)</span><span class="gold">${money(fee)}</span></div>
    <p class="muted" style="margin:0">জয়েন নিশ্চিত করলে ওয়ালেট থেকে এন্ট্রি ফি কাটা হবে।</p>`,
    `<button class="btn" data-act="close">বাতিল</button>
     <button class="btn red" data-act="doJoin" data-id="${Number(id)}">JOIN NOW — ${money(fee)}</button>`);
}

async function doJoin(id) {
  const name = ($('jName') ? $('jName').value : '').trim();
  if (name.length < 2) { toast('আপনার Free Fire আইডির নাম দিন', 'error'); return; }
  try {
    const r = await api(`/api/tournaments/${id}/join`, {
      method: 'POST',
      body: JSON.stringify({ ff_name: name }),
    });
    localStorage.setItem('ffName', name);
    closeModal();
    toast(r.message || 'জয়েন সফল 🎉', 'success');
    ALL = await api('/api/tournaments');
    loadWallet();
    if (S.view === 'cat') renderCat();
    if (S.view === 'home') loadHome();
  } catch (e) {
    toast(e.message, 'error');
    if (isAuthErr(e.message)) logout(e.message);
  }
}

async function openRoom(id) {
  try {
    const t = await api(`/api/tournaments/${id}`);
    const body = t.room_id
      ? `<div class="roombox">🔑 Room ID: <b>${esc(t.room_id)}</b><br>🔒 Password: <b>${esc(t.room_password || '-')}</b></div>`
      : `<p class="muted">রুম আইডি এখনো প্রকাশ হয়নি। অ্যাডমিন প্রকাশ করলে এখানে দেখা যাবে।</p>`;
    openModal('Room ID', body, `<button class="btn" data-act="close">বন্ধ করুন</button>`);
  } catch (e) { toast(e.message, 'error'); }
}

function openPrize(id) {
  const t = ALL.find(x => Number(x.id) === Number(id));
  if (!t) return;
  openModal('Prize Pool', `<div class="prz">
    <div>🏆 প্রাইজ পুল <b>${esc(t.prize || '-')}</b></div>
    <div>🎯 প্রতি কিল <b>${money(t.per_kill)}</b></div>
    <div>💳 এন্ট্রি ফি <b>${money(t.entry_fee)}</b></div>
    <div>👥 স্লট <b>${Number(t.joined) || 0}/${Number(t.max_slots) || 0}</b></div>
  </div>`, `<button class="btn" data-act="close">বন্ধ করুন</button>`);
}

async function loadMy() {
  $('myList').innerHTML = loader();
  try {
    MY = await api('/api/my-matches');
    renderMy();
  } catch (e) {
    $('myList').innerHTML = errBox(e.message);
    if (isAuthErr(e.message)) logout(e.message);
  }
}

function renderMy() {
  document.querySelectorAll('#v-matches .tab').forEach(b => b.classList.toggle('on', b.dataset.id === S.mtab));
  const now = new Date();
  const list = MY.filter(m => {
    const c = cleanTime(m.starts_at);
    const past = c && localDate(c) < now;
    return S.mtab === 'all' || !past;
  });
  $('myList').innerHTML = list.map(m => {
    const c = cleanTime(m.starts_at);
    const past = c && localDate(c) < new Date();
    const when = c ? fmtDT(c) : 'সময় ঘোষণা হবে';
    const room = m.room_id
      ? `<div class="roombox">🔑 Room ID: <b>${esc(m.room_id)}</b><br>🔒 Password: <b>${esc(m.room_password || '-')}</b></div>`
      : `<div class="roombox muted">রুম আইডি এখনো প্রকাশ হয়নি</div>`;
    return `
      <div class="mc">
        <span class="badge ${past ? 'live' : 'up'}">${past ? 'LIVE / শেষ' : 'UPCOMING'}</span>
        <div class="mtitle" style="padding-right:90px">
          <h4>${esc(m.name)}</h4>
          <div class="mtime">${esc(when)}</div>
        </div>
        <div class="tags" style="margin-top:10px">
          <span>${esc(m.category_name || '')}</span>
          <span>🗺️ ${esc(m.map_name || '-')}</span>
          <span>🏆 ${esc(m.prize || '-')}</span>
        </div>
        ${room}
      </div>`;
  }).join('') || empty('🎯', 'আপনি এখনো কোনো ম্যাচে জয়েন করেননি');
}

async function loadWallet() {
  if (!token) return;
  try {
    const w = await api('/api/wallet');
    $('wChip').textContent = money(w.balance);
    $('wBal').textContent = money(w.balance);
  } catch (e) {
    if (isAuthErr(e.message)) logout(e.message);
  }
}

async function loadProfile() {
  $('pName').textContent = userName || 'খেলোয়াড়';
  $('pav').textContent = (userName || '?').trim().charAt(0).toUpperCase();
  loadWallet();
  $('hist').innerHTML = loader();
  try {
    const h = await api('/api/wallet/history');
    const dep = h.deposits || [], wit = h.withdrawals || [], tx = h.transactions || [];
    const approved = dep.filter(d => d.status === 'approved').reduce((s, d) => s + Number(d.amount), 0);
    $('wDep').textContent = money(approved);
    const items = [
      ...dep.map(d => ({ t: 'ডিপোজিট · ' + (METHOD[d.method] || d.method), amt: Number(d.amount), st: d.status, at: d.created_at })),
      ...wit.map(w => ({ t: 'উইথড্রয়াল · ' + (METHOD[w.method] || w.method), amt: -Number(w.amount), st: w.status, at: w.created_at })),
      ...tx.map(x => ({ t: x.note || x.type, amt: Number(x.amount), st: '', at: x.created_at })),
    ].sort((a, b) => String(b.at).localeCompare(String(a.at))).slice(0, 40);
    $('hist').innerHTML = items.map(i => `
      <div class="hrow">
        <div><b>${esc(i.t)}</b><br><small>${esc(cleanTime(i.at))}</small></div>
        <div style="text-align:right">
          <div class="amt ${i.amt >= 0 ? 'pos' : 'neg'}">${i.amt >= 0 ? '+' : ''}${money(i.amt)}</div>
          ${i.st ? `<span class="pill ${esc(i.st)}">${esc(STATUS_BN[i.st] || i.st)}</span>` : ''}
        </div>
      </div>`).join('') || empty('🧾', 'এখনো কোনো লেনদেন নেই');
  } catch (e) {
    $('hist').innerHTML = errBox(e.message);
    if (isAuthErr(e.message)) logout(e.message);
  }
}

function showPayNo() {
  const num = SETTINGS[S.dM + '_number'];
  $('payNo').innerHTML = num
    ? `এই ${METHOD[S.dM]} নম্বরে <b>Send Money</b> করুন:<br><b style="font-size:18px">${esc(num)}</b>`
    : `${METHOD[S.dM]} নম্বর এখনো সেট করা হয়নি। অ্যাডমিনের সঙ্গে যোগাযোগ করুন।`;
}

function pickD(m) {
  S.dM = m;
  $('sheetBody').querySelectorAll('.seg3 button').forEach(b => b.classList.toggle('on', b.dataset.id === m));
  showPayNo();
}

function openDeposit() {
  openModal('Add Money', `
    <div class="seg3">
      ${['bkash', 'nagad', 'rocket'].map(m => `<button class="${m === S.dM ? 'on' : ''}" data-act="pickD" data-id="${m}">${METHOD[m]}</button>`).join('')}
    </div>
    <div class="note" id="payNo"></div>
    <label>পরিমাণ (৳)</label><input id="dAmt" inputmode="numeric">
    <label>যে নম্বর থেকে টাকা পাঠিয়েছেন</label><input id="dSen" inputmode="tel">
    <label>Transaction ID (TrxID)</label><input id="dTrx" autocapitalize="characters">`,
    `<button class="btn" data-act="close">বাতিল</button>
     <button class="btn red" data-act="submitDep">অনুরোধ পাঠান</button>`);
  showPayNo();
}

async function submitDep() {
  const body = {
    method: S.dM,
    amount: $('dAmt').value,
    sender_number: $('dSen').value,
    trx_id: $('dTrx').value,
  };
  if (!body.amount || !body.sender_number || !body.trx_id) { toast('সব ঘর পূরণ করুন', 'error'); return; }
  try {
    const r = await api('/api/deposits', { method: 'POST', body: JSON.stringify(body) });
    closeModal();
    toast(r.message, 'success');
    loadProfile();
  } catch (e) { toast(e.message, 'error'); }
}

function pickW(m) {
  S.wM = m;
  $('sheetBody').querySelectorAll('.seg3 button').forEach(b => b.classList.toggle('on', b.dataset.id === m));
}

function openWithdraw() {
  openModal('Withdraw', `
    <div class="seg3">
      ${['bkash', 'nagad', 'rocket'].map(m => `<button class="${m === S.wM ? 'on' : ''}" data-act="pickW" data-id="${m}">${METHOD[m]}</button>`).join('')}
    </div>
    <label>পরিমাণ (৳, সর্বনিম্ন ৫০)</label><input id="wAmt" inputmode="numeric">
    <label>যে নম্বরে টাকা নেবেন</label><input id="wAcc" inputmode="tel">
    <div class="note">অনুরোধ করলে ব্যালেন্স থেকে টাকা এখনই কেটে রাখা হবে। বাতিল হলে টাকা ফেরত যাবে।</div>`,
    `<button class="btn" data-act="close">বাতিল</button>
     <button class="btn red" data-act="submitWit">অনুরোধ পাঠান</button>`);
}

async function submitWit() {
  const body = {
    method: S.wM,
    amount: $('wAmt').value,
    account_number: $('wAcc').value,
  };
  if (!body.amount || !body.account_number) { toast('পরিমাণ ও নম্বর দিন', 'error'); return; }
  try {
    const r = await api('/api/withdrawals', { method: 'POST', body: JSON.stringify(body) });
    closeModal();
    toast(r.message, 'success');
    loadProfile();
  } catch (e) { toast(e.message, 'error'); }
}

const A = {
  close: () => closeModal(),
  login: () => login(),
  register: () => register(),
  authTab: id => showAuth(id),
  go: id => showView(id, true),
  openCat: id => { S.cat = id; showView('cat', true); },
  soon: () => toast('এই ফিচারটি শীঘ্রই আসছে'),
  join: id => openJoin(id),
  doJoin: id => doJoin(id),
  room: id => openRoom(id),
  prize: id => openPrize(id),
  mtab: id => { S.mtab = id; renderMy(); },
  deposit: () => openDeposit(),
  withdraw: () => openWithdraw(),
  pickD: id => pickD(id),
  pickW: id => pickW(id),
  submitDep: () => submitDep(),
  submitWit: () => submitWit(),
  logout: () => { if (confirm('লগআউট করবেন?')) logout(); },
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const fn = A[b.dataset.act];
  if (fn) fn(b.dataset.id);
});

async function loadSettings() {
  try {
    SETTINGS = await fetch(API + '/api/settings', { cache: 'no-store' }).then(r => r.json());
    if (SETTINGS.app_title) $('brand').innerHTML = esc(SETTINGS.app_title);
  } catch {}
}

(async function init() {
  fetch(API + '/api/health', { cache: 'no-store' }).catch(() => {});
  await loadSettings();
  if (token) {
    $('auth').classList.add('hidden');
    $('app').classList.remove('hidden');
    history.replaceState({ v: 'home', cat: '' }, '');
    showView('home', false);
    loadWallet();
  } else {
    $('auth').classList.remove('hidden');
    const flash = sessionStorage.getItem('flash');
    if (flash) { $('authMsg').textContent = flash; sessionStorage.removeItem('flash'); }
  }
})();
</script>
</body>
