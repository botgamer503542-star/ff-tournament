<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<link rel="manifest" href="manifest.json">
<title>FF Admin</title>
<style>
:root {
  --bg: #0b0f1a; --panel: #111827; --card: #162036; --card2: #1d2944; --line: #263354;
  --text: #eef2ff; --muted: #8b97b5; --accent: #6d5efc; --accent2: #22d3ee;
  --green: #22c55e; --red: #ef4444; --amber: #f59e0b; --gold: #fbbf24;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, "Noto Sans Bengali", sans-serif; -webkit-tap-highlight-color: transparent; }
body { min-height: 100vh; padding-bottom: 88px; }
.hidden { display: none !important; }

button {
  font-family: inherit; cursor: pointer; font-size: 14px; font-weight: 600;
  padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card2); color: var(--text); transition: transform .08s, opacity .2s;
}
button:active { transform: scale(.97); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.primary { background: linear-gradient(135deg, #6d5efc, #22d3ee); border: none; color: #fff; }
button.ok { background: var(--green); border: none; color: #fff; }
button.danger { background: var(--red); border: none; color: #fff; }
button.sm { padding: 8px 12px; font-size: 13px; }
button.block { width: 100%; }

input, select {
  width: 100%; padding: 13px; margin-bottom: 12px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--card); color: var(--text);
  font-size: 15px; font-family: inherit;
}
input:focus, select:focus { outline: none; border-color: var(--accent); }
label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
.muted { color: var(--muted); font-size: 13px; }
.mono { font-family: ui-monospace, Menlo, monospace; letter-spacing: .5px; }

/* লগইন */
#login {
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg) 60%);
}
.login-box { width: 100%; max-width: 380px; text-align: center; }
.logo {
  width: 68px; height: 68px; margin: 0 auto 14px; border-radius: 20px;
  background: linear-gradient(135deg, #6d5efc, #22d3ee);
  display: flex; align-items: center; justify-content: center; font-size: 30px;
  box-shadow: 0 12px 30px rgba(109,94,252,.35);
}
.login-box h1 { margin: 0 0 4px; font-size: 22px; }
.login-box .card { margin-top: 22px; text-align: left; }

/* হেডার */
header {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; background: rgba(11,15,26,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; }
.brand .mini { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg,#6d5efc,#22d3ee); display: flex; align-items: center; justify-content: center; font-size: 16px; }
.head-actions { display: flex; gap: 8px; }
.icon-btn { width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 17px; }

main { padding: 16px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.page-head h2 { margin: 0 0 3px; font-size: 20px; }
.page-head p { margin: 0; }

/* পরিসংখ্যান */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat {
  background: linear-gradient(160deg, var(--card), var(--card2)); border: 1px solid var(--line);
  border-radius: 16px; padding: 14px; cursor: pointer; text-align: left; color: var(--text);
}
.stat .ic { font-size: 22px; margin-bottom: 8px; }
.stat .num { font-size: 26px; font-weight: 800; }
.stat .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }
.stat.alert { border-color: var(--amber); box-shadow: 0 0 0 1px rgba(245,158,11,.35) inset; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
h3 { margin: 22px 0 10px; font-size: 16px; }

.notice { margin-top: 16px; padding: 12px; border-radius: 12px; background: #3b2a06; color: #fde68a; font-size: 14px; }

/* ফিল্টার চিপ */
.chips { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; border-radius: 999px; padding: 8px 14px; font-size: 13px; background: var(--card); }
.chip.on { background: linear-gradient(135deg,#6d5efc,#22d3ee); color: #fff; border: none; }

/* আইটেম কার্ড */
.item {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 14px; margin-bottom: 12px; animation: rise .3s ease both;
}
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.item-top b { font-size: 15px; }
.amount { font-size: 18px; font-weight: 800; color: var(--gold); white-space: nowrap; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 12px 0; font-size: 13px; }
.kv span { color: var(--muted); }
.kv b { text-align: right; word-break: break-all; }
.item-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }

.pill { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--card2); color: var(--muted); }
.pill.pending { background: var(--amber); color: #111; }
.pill.approved, .pill.paid, .pill.open, .pill.up { background: var(--green); color: #fff; }
.pill.rejected, .pill.hidden, .pill.full { background: var(--red); color: #fff; }
.pill.closed { background: #475569; color: #fff; }
.pill.banned { background: var(--red); color: #fff; }

/* ইউজার */
.avatar {
  width: 42px; height: 42px; border-radius: 50%; flex: 0 0 auto;
  background: linear-gradient(135deg,#6d5efc,#22d3ee); display: flex; align-items: center; justify-content: center; font-weight: 800;
}
.user-row { display: flex; gap: 12px; align-items: center; }
.user-row .info { flex: 1; min-width: 0; }
.user-row .info b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bal { font-weight: 800; color: var(--gold); }
.search { position: relative; margin-bottom: 14px; }
.search input { padding-left: 42px; margin: 0; }
.search::before { content: "🔍"; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 15px; }

/* টুর্নামেন্ট */
.t-item { padding: 0; overflow: hidden; }
.t-stripe { height: 6px; background: linear-gradient(90deg,#6d5efc,#22d3ee); }
.t-body { padding: 14px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.meta span { font-size: 12px; background: var(--card2); border-radius: 8px; padding: 5px 9px; color: var(--muted); }
.bar { height: 6px; background: var(--card2); border-radius: 99px; overflow: hidden; margin: 10px 0 12px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg,#6d5efc,#22d3ee); }

/* খালি ও লোড */
.empty { text-align: center; padding: 40px 10px; color: var(--muted); }
.empty .big { font-size: 40px; margin-bottom: 8px; }
.err-box { padding: 14px; border-radius: 12px; background: #3f1d1d; color: #fecaca; font-size: 14px; }
.loader { margin: 40px auto; width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--card2); border-top-color: var(--accent2); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* নেভিগেশন */
.bottom-nav {
  position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 30;
  display: flex; background: var(--panel); border: 1px solid var(--line);
  border-radius: 20px; padding: 6px; box-shadow: 0 12px 30px rgba(0,0,0,.45);
}
.nav-btn {
  flex: 1; background: none; border: none; padding: 8px 2px; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; border-radius: 14px;
}
.nav-btn span { font-size: 18px; }
.nav-btn.on { color: var(--text); background: rgba(109,94,252,.22); }

/* মডাল ও টোস্ট */
.modal {
  position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.65);
  display: flex; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity .2s;
}
.modal.show { opacity: 1; }
.sheet {
  width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto;
  background: var(--panel); border-radius: 22px 22px 0 0; border-top: 1px solid var(--line);
  transform: translateY(30px); transition: transform .2s;
}
.modal.show .sheet { transform: none; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
.sheet-head h3 { margin: 0; font-size: 17px; }
.sheet-body { padding: 16px 18px; }
.sheet-foot { display: flex; gap: 8px; padding: 14px 18px 22px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--panel); }
.sheet-foot button { flex: 1; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.toasts { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 60; width: 92%; max-width: 420px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast {
  background: var(--card2); border-left: 4px solid var(--accent); padding: 12px 14px; border-radius: 12px;
  font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.4); opacity: 0; transform: translateY(-8px); transition: .25s;
}
.toast.show { opacity: 1; transform: none; }
.toast.success { border-color: var(--green); }
.toast.error { border-color: var(--red); }
</style>
</head>
<body>

<!-- লগইন -->
<div id="login" class="hidden">
  <div class="login-box">
    <div class="logo">🛡️</div>
    <h1>FF Tournament Admin</h1>
    <p class="muted">শুধু অনুমোদিত অ্যাডমিন প্রবেশ করতে পারবেন</p>
    <div class="card" style="background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px">
      <div class="muted" id="serverMsg" style="margin-bottom:10px;min-height:18px"></div>
      <label>অ্যাডমিন পাসওয়ার্ড</label>
      <input id="adminPass" type="password" placeholder="পাসওয়ার্ড লিখুন">
      <button class="primary block" id="loginBtn">লগইন</button>
      <div class="muted" id="loginMsg" style="margin-top:10px;min-height:18px;color:#fbbf24"></div>
    </div>
  </div>
</div>

<!-- মূল অ্যাপ -->
<div id="app" class="hidden">
  <header>
    <div class="brand"><div class="mini">🛡️</div><span>FF Admin</span></div>
    <div class="head-actions">
      <button class="icon-btn" data-act="settings" title="সেটিংস">⚙️</button>
      <button class="icon-btn" data-act="logout" title="লগআউট">⏻</button>
    </div>
  </header>

  <main id="view"></main>

  <nav class="bottom-nav" id="nav">
    <button class="nav-btn" data-act="go" data-id="dash"><span>📊</span>ড্যাশবোর্ড</button>
    <button class="nav-btn" data-act="go" data-id="deposits"><span>💳</span>ডিপোজিট</button>
    <button class="nav-btn" data-act="go" data-id="withdrawals"><span>🏦</span>উইথড্র</button>
    <button class="nav-btn" data-act="go" data-id="users"><span>👥</span>ইউজার</button>
    <button class="nav-btn" data-act="go" data-id="tournaments"><span>🏆</span>টুর্নামেন্ট</button>
  </nav>
</div>

<!-- মডাল -->
<div class="modal hidden" id="modal">
  <div class="sheet">
    <div class="sheet-head"><h3 id="mTitle"></h3><button class="icon-btn sm" data-act="close">✕</button></div>
    <div class="sheet-body" id="mBody"></div>
    <div class="sheet-foot" id="mFoot"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
const API = 'https://production-o2k8.onrender.com';
const $ = id => document.getElementById(id);

let adminToken = sessionStorage.getItem('adminToken') || '';
const S = { view: 'dash', depStatus: 'pending', witStatus: 'pending', users: [], tours: [], cats: [], search: '' };

const METHOD = { bkash: 'bKash', nagad: 'Nagad', rocket: 'Rocket' };
const STATUS = { pending: 'অপেক্ষমাণ', approved: 'অনুমোদিত', paid: 'পরিশোধিত', rejected: 'বাতিল' };
const TSTATUS = { open: 'জয়েন চালু', closed: 'জয়েন বন্ধ', hidden: 'লুকানো' };

// ---------- সাধারণ সহায়ক ----------

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// ডেটাবেসের সময় যেমন আছে তেমনই দেখাই (সময় পরিবর্তন হয় না)
function fmt(s) { return s ? String(s).replace('T', ' ').replace('Z', '').slice(0, 16) : '-'; }
function money(n) { return '৳' + (Number(n) || 0).toLocaleString('en-US'); }
function empty(icon, text) { return `<div class="empty"><div class="big">${icon}</div>${esc(text)}</div>`; }
function errBox(text) { return `<div class="err-box">${esc(text)}</div>`; }
function loader() { return '<div class="loader"></div>'; }

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('toasts').appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 3000);
}

function fail(e) {
  toast(e.message, 'error');
  if (/অনুমতি|মেয়াদ/.test(e.message)) logout();
}

async function api(path, opts = {}, tries = 2) {
  for (let i = 1; i <= tries; i++) {
    try {
      const res = await fetch(API + path, {
        cache: 'no-store', ...opts,
        headers: {
          'Content-Type': 'application/json',
          ...(adminToken ? { Authorization: 'Bearer ' + adminToken } : {}),
        },
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'সমস্যা হয়েছে (' + res.status + ')');
      return data;
    } catch (e) {
      if (e instanceof TypeError) {
        if (i < tries) { await new Promise(r => setTimeout(r, 8000)); continue; }
        throw new Error('সার্ভারে পৌঁছানো যাচ্ছে না। ১ মিনিট পর আবার চেষ্টা করুন।');
      }
      throw e;
    }
  }
}

// ---------- মডাল ও নিশ্চিতকরণ ----------

function openModal(title, body, foot = '') {
  $('mTitle').textContent = title;
  $('mBody').innerHTML = body;
  $('mFoot').innerHTML = foot;
  $('modal').classList.remove('hidden');
  requestAnimationFrame(() => $('modal').classList.add('show'));
}

function closeModal() {
  $('modal').classList.remove('show');
  setTimeout(() => $('modal').classList.add('hidden'), 200);
}

function confirmBox(msg, onYes, yesText = 'হ্যাঁ, নিশ্চিত', danger = false) {
  openModal('নিশ্চিত করুন',
    `<p style="line-height:1.7;margin:0">${esc(msg)}</p>`,
    `<button data-act="close">না</button>
     <button class="${danger ? 'danger' : 'primary'}" id="yesBtn">${esc(yesText)}</button>`);
  $('yesBtn').onclick = () => { closeModal(); onYes(); };
}

// ---------- কাজের হ্যান্ডলার (ডেলিগেশন) ----------

const A = {
  close: () => closeModal(),
  go: v => setView(v),
  refresh: () => renderView(),
  logout: () => confirmBox('লগআউট করবেন?', logout, 'লগআউট', true),
  settings: () => openSettings(),
  'dep-filter': s => { S.depStatus = s; renderDeposits(); },
  'wit-filter': s => { S.witStatus = s; renderWithdr
