<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<title>Admin</title>
<style>
  body { font-family: sans-serif; background: #0f172a; color: #f1f5f9; margin: 0; padding: 16px 16px 60px; }
  input, select, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px; border: none; font-size: 15px; box-sizing: border-box; }
  input, select { background: #1e293b; color: #f1f5f9; }
  button { background: #2563eb; color: white; }
  button.small { width: auto; padding: 8px 12px; font-size: 13px; margin: 4px 4px 0 0; }
  .danger { background: #dc2626; }
  .ok { background: #16a34a; }
  .grey { background: #374151; }
  .card { background: #1e293b; padding: 12px; border-radius: 10px; margin: 8px 0; font-size: 14px; line-height: 1.6; }
  .hidden { display: none !important; }
  .msg { color: #fbbf24; min-height: 22px; margin: 6px 0; font-size: 14px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; margin: 10px 0; }
  .tabs button { width: auto; flex: 0 0 auto; padding: 10px 14px; margin: 0; background: #1e293b; }
  .tabs button.on { background: #2563eb; }
  h3 { margin: 22px 0 8px; border-bottom: 1px solid #334155; padding-bottom: 6px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #334155; }
  .pill.pending { background: #f59e0b; color: #111; }
  .pill.approved, .pill.paid { background: #16a34a; }
  .pill.rejected { background: #dc2626; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
</style>
</head>
<body>

<div id="loginView">
  <h2>অ্যাডমিন লগইন</h2>
  <div class="msg" id="serverMsg"></div>
  <input id="adminPass" type="password" placeholder="অ্যাডমিন পাসওয়ার্ড">
  <button onclick="adminLogin()">লগইন</button>
  <div class="msg" id="loginMsg"></div>
</div>

<div id="dashView" class="hidden">
  <h2>অ্যাডমিন প্যানেল</h2>
  <div class="msg" id="dashMsg"></div>

  <div class="tabs">
    <button id="tabDep" class="on" onclick="tab('dep')">ডিপোজিট</button>
    <button id="tabWit" onclick="tab('wit')">উইথড্রয়াল</button>
    <button id="tabUsr" onclick="tab('usr')">ইউজার</button>
    <button id="tabTour" onclick="tab('tour')">টুর্নামেন্ট</button>
    <button id="tabSet" onclick="tab('set')">সেটিংস</button>
  </div>

  <!-- ডিপোজিট যাচাই -->
  <div id="pDep">
    <div class="tabs">
      <button id="dsP" class="on" onclick="loadDeposits('pending')">অপেক্ষমাণ</button>
      <button id="dsA" onclick="loadDeposits('approved')">অনুমোদিত</button>
      <button id="dsR" onclick="loadDeposits('rejected')">বাতিল</button>
    </div>
    <div id="depList"></div>
  </div>

  <!-- উইথড্রয়াল পরিশোধ -->
  <div id="pWit" class="hidden">
    <div class="tabs">
      <button id="wsP" class="on" onclick="loadWithdrawals('pending')">অপেক্ষমাণ</button>
      <button id="wsD" onclick="loadWithdrawals('paid')">পরিশোধিত</button>
      <button id="wsR" onclick="loadWithdrawals('rejected')">বাতিল</button>
    </div>
    <div id="witList"></div>
  </div>

  <!-- ইউজার -->
  <div id="pUsr" class="hidden">
    <button class="grey" onclick="loadUsers()">রিফ্রেশ</button>
    <div id="userList"></div>
  </div>

  <!-- টুর্নামেন্ট -->
  <div id="pTour" class="hidden">
    <h3 id="tFormTitle">নতুন টুর্নামেন্ট</h3>
    <input id="tName" placeholder="টুর্নামেন্টের নাম">
    <select id="tCat"></select>
    <input id="tType" placeholder="ম্যাচ টাইপ (যেমন Classic Solo)">
    <input id="tMap" placeholder="ম্যাপ (যেমন Bermuda)" value="Bermuda">
    <div class="row2">
      <input id="tSlots" type="number" placeholder="মোট স্লট" value="48">
      <input id="tKill" type="number" placeholder="প্রতি কিল (৳)">
    </div>
    <div class="row2">
      <input id="tFee" type="number" placeholder="এন্ট্রি ফি (৳)">
      <input id="tPrize" placeholder="প্রাইজ পুল (যেমন ৳১০০০)">
    </div>
    <input id="tStart" type="datetime-local">
    <input id="tImg" placeholder="ছবির লিংক (ঐচ্ছিক)">
    <select id="tStatus">
      <option value="open">open (জয়েন চালু)</option>
      <option value="closed">closed (জয়েন বন্ধ)</option>
      <option value="hidden">hidden (ইউজার দেখবে না)</option>
    </select>
    <button id="tSave" onclick="saveTournament()">যোগ করুন</button>
    <button id="tCancel" class="grey hidden" onclick="resetTForm()">এডিট বাতিল</button>

    <h3>টুর্নামেন্ট তালিকা</h3>
    <button class="grey" onclick="loadTournaments()">রিফ্রেশ</button>
    <div id="tourList"></div>
  </div>

  <!-- সেটিংস -->
  <div id="pSet" class="hidden">
    <h3>অ্যাপের লেখা</h3>
    <input id="sTitle" placeholder="অ্যাপের শিরোনাম (app_title)">
    <input id="sWelcome" placeholder="স্বাগত বার্তা (welcome_text)">
    <button onclick="saveSettings(['app_title','welcome_text'])">সেভ করুন</button>

    <h3>পেমেন্ট নম্বর (ইউজার ডিপোজিট করবে এখানে)</h3>
    <input id="sBkash" inputmode="tel" placeholder="bKash নম্বর">
    <input id="sNagad" inputmode="tel" placeholder="Nagad নম্বর">
    <input id="sRocket" inputmode="tel" placeholder="Rocket নম্বর">
    <button onclick="saveSettings(['bkash_number','nagad_number','rocket_number'])">পেমেন্ট নম্বর সেভ</button>
  </div>

  <button class="danger" style="margin-top:24px" onclick="logout()">লগআউট</button>
</div>

<script>
const API = 'https://production-o2k8.onrender.com';
let adminToken = sessionStorage.getItem('adminToken') || '';
let tourneys = [];
let editId = null;
let curDepStatus = 'pending';
let curWitStatus = 'pending';

const $ = id => document.getElementById(id);
const METHOD = { bkash: 'bKash', nagad: 'Nagad', rocket: 'Rocket' };
const STATUS = { pending: 'অপেক্ষমাণ', approved: 'অনুমোদিত', paid: 'পরিশোধিত', rejected: 'বাতিল' };

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtTime(s) {
  return s ? new Date(s).toLocaleString('bn-BD', { dateStyle: 'medium', timeStyle: 'short' }) : '-';
}
function say(text, id = 'dashMsg') { $(id).textContent = text; }

async function api(path, opts = {}, tries = 2) {
  for (let i = 1; i <= tries; i++) {
    try {
      const res = await fetch(API + path, {
        cache: 'no-store', ...opts,
        headers: {
          'Content-Type': 'application/json',
          ...(adminToken ? { Authorization: 'Bearer ' + adminToken } : {}),
        },
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'সমস্যা হয়েছে (' + res.status + ')');
      return data;
    } catch (e) {
      if (e instanceof TypeError) {
        if (i < tries) { await new Promise(r => setTimeout(r, 8000)); continue; }
        throw new Error('সার্ভারে পৌঁছানো যাচ্ছে না। ১ মিনিট পর আবার চেষ্টা করুন।');
      }
      throw e;
    }
  }
}

function handleErr(e, id = 'dashMsg') {
  say(e.message, id);
  if (/অনুমতি|মেয়াদ/.test(e.message)) logout();
}

async function wake() {
  say('সার্ভার চেক হচ্ছে...', 'serverMsg');
  try { await fetch(API + '/api/health', { cache: 'no-store' }); say('সার্ভার প্রস্তুত', 'serverMsg'); }
  catch { say('সার্ভার জাগছে। ৬০ সেকেন্ড পর লগইন করুন।', 'serverMsg'); }
}

async function adminLogin() {
  say('লগইন হচ্ছে...', 'loginMsg');
  try {
    const d = await api('/api/admin/login', {
      method: 'POST', body: JSON.stringify({ password: $('adminPass').value }),
    });
    adminToken = d.token;
    sessionStorage.setItem('adminToken', adminToken);
    say('', 'loginMsg');
    showDash();
  } catch (e) { say(e.message, 'loginMsg'); }
}

function logout() {
  adminToken = '';
  sessionStorage.removeItem('adminToken');
  location.reload();
}

function showDash() {
  $('loginView').classList.add('hidden');
  $('dashView').classList.remove('hidden');
  tab('dep');
  loadSettingsForm();
}

function tab(which) {
  const map = { dep: 'pDep', wit: 'pWit', usr: 'pUsr', tour: 'pTour', set: 'pSet' };
  Object.entries(map).forEach(([k, id]) => $(id).classList.toggle('hidden', k !== which));
  ['dep','wit','usr','tour','set'].forEach(k => $('tab' + k[0].toUpperCase() + k.slice(1)).classList.toggle('on', k === which));
  if (which === 'dep') loadDeposits(curDepStatus);
  if (which === 'wit') loadWithdrawals(curWitStatus);
  if (which === 'usr') loadUsers();
  if (which === 'tour') { loadCategories(); loadTournaments(); }
}

// ---------- ডিপোজিট ----------

async function loadDeposits(status) {
  curDepStatus = status;
  ['P','A','R'].forEach((k, i) => $('ds' + k).classList.toggle('on', ['pending','approved','rejected'][i] === status));
  $('depList').innerHTML = '<p>লোড হচ্ছে...</p>';
  try {
    const list = await api('/api/admin/deposits?status=' + status);
    $('depList').innerHTML = list.map(d => `
      <div class="card">
        <b>${esc(d.name)}</b> (UID: ${esc(d.ff_id)})<br>
        ফোন: ${esc(d.phone)}<br>
        ${esc(METHOD[d.method] || d.method)} · <b>৳${Number(d.amount)}</b><br>
        পাঠানো নম্বর: ${esc(d.sender_number)}<br>
        TrxID: <b>${esc(d.trx_id)}</b><br>
        সময়: ${esc(fmtTime(d.created_at))}<br>
        <span class="pill ${esc(d.status)}">${esc(STATUS[d.status])}</span><br>
        ${status === 'pending' ? `
          <button class="small ok" onclick="approveDeposit(${Number(d.id)})">অনুমোদন (ব্যালেন্সে যোগ)</button>
          <button class="small danger" onclick="rejectDeposit(${Number(d.id)})">বাতিল</button>` : ''}
      </div>`).join('') || '<p>এই তালিকায় কিছু নেই</p>';
  } catch (e) { handleErr(e); }
}

async function approveDeposit(id) {
  if (!confirm('আপনি কি নিজের bKash/Nagad/Rocket-এ এই টাকা পেয়েছেন? অনুমোদন করলে ব্যালেন্স বাড়বে।')) return;
  try {
    await api(`/api/admin/deposits/${id}/approve`, { method: 'POST' });
    say('অনুমোদন হয়েছে, ব্যালেন্স যোগ হয়েছে');
    loadDeposits('pending');
  } catch (e) { handleErr(e); }
}

async function rejectDeposit(id) {
  if (!confirm('এই ডিপোজিট অনুরোধ বাতিল করবেন?')) return;
  try {
    await api(`/api/admin/deposits/${id}/reject`, { method: 'POST' });
    say('বাতিল করা হয়েছে');
    loadDeposits('pending');
  } catch (e) { handleErr(e); }
}

// ---------- উইথড্রয়াল ----------

async function loadWithdrawals(status) {
  curWitStatus = status;
  ['P','D','R'].forEach((k, i) => $('ws' + k).classList.toggle('on', ['pending','paid','rejected'][i] === status));
  $('witList').innerHTML = '<p>লোড হচ্ছে...</p>';
  try {
    const list = await api('/api/admin/withdrawals?status=' + status);
    $('witList').innerHTML = list.map(w => `
      <div class="card">
        <b>${esc(w.name)}</b> (UID: ${esc(w.ff_id)})<br>
        ফোন: ${esc(w.phone)}<br>
        ${esc(METHOD[w.method] || w.method)} · <b>৳${Number(w.amount)}</b><br>
        টাকা পাঠাতে হবে এই নম্বরে: <b>${esc(w.account_number)}</b><br>
        সময়: ${esc(fmtTime(w.created_at))}<br>
        <span class="pill ${esc(w.status)}">${esc(STATUS[w.status])}</span><br>
        ${status === 'pending' ? `
          <button class="small ok" onclick="paidWithdraw(${Number(w.id)})">পাঠানো হয়েছে</button>
          <button class="small danger" onclick="rejectWithdraw(${Number(w.id)})">বাতিল (টাকা ফেরত)</button>` : ''}
      </div>`).join('') || '<p>এই তালিকায় কিছু নেই</p>';
  } catch (e) { handleErr(e); }
}

async function paidWithdraw(id) {
  if (!confirm('আপনি কি এই নম্বরে টাকা পাঠিয়ে দিয়েছেন?')) return;
  try {
    await api(`/api/admin/withdrawals/${id}/paid`, { method: 'POST' });
    say('পরিশোধিত হিসেবে চিহ্নিত');
    loadWithdrawals('pending');
  } catch (e) { handleErr(e); }
}

async function rejectWithdraw(id) {
  if (!confirm('বাতিল করলে টাকা ইউজারের ব্যালেন্সে ফেরত যাবে। নিশ্চিত?')) return;
  try {
    await api(`/api/admin/withdrawals/${id}/reject`, { method: 'POST' });
    say('বাতিল হয়েছে, টাকা ফেরত দেওয়া হয়েছে');
    loadWithdrawals('pending');
  } catch (e) { handleErr(e); }
}

// ---------- ইউজার ----------

async function loadUsers() {
  $('userList').innerHTML = '<p>লোড হচ্ছে...</p>';
  try {
    const users = await api('/api/admin/users');
    $('userList').innerHTML = users.map(u => `
      <div class="card">
        <b>${esc(u.name)}</b> (UID: ${esc(u.ff_id)})<br>
        ফোন: ${esc(u.phone)} · ব্যালেন্স: <b>৳${Number(u.balance)}</b><br>
        অবস্থা: ${u.is_banned ? '<span style="color:#f87171">ব্যান</span>' : 'সক্রিয়'}<br>
        <button class="small ok" onclick="adjustBalance(${Number(u.id)}, 1)">+ ব্যালেন্স যোগ</button>
        <button class="small grey" onclick="adjustBalance(${Number(u.id)}, -1)">- ব্যালেন্স কমান</button>
        <button class="small ${u.is_banned ? 'ok' : 'danger'}"
          onclick="${u.is_banned ? 'unban' : 'ban'}(${Number(u.id)})">${u.is_banned ? 'আনব্যান' : 'ব্যান'}</button>
      </div>`).join('') || '<p>কোনো ইউজার নেই</p>';
  } catch (e) { handleErr(e); }
}

async function adjustBalance(id, sign) {
  const amt = prompt(sign > 0 ? 'কত টাকা যোগ করবেন? (৳)' : 'কত টাকা কমাবেন? (৳)');
  if (!amt) return;
  const n = Math.abs(parseInt(amt, 10));
  if (!n) { say('সঠিক পরিমাণ দিন'); return; }
  const note = prompt('নোট (ঐচ্ছিক, যেমন: bKash ম্যানুয়াল ডিপোজিট)', 'অ্যাডমিন সমন্বয়') || 'অ্যাডমিন সমন্বয়';
  try {
    await api(`/api/admin/users/${id}/balance`, {
      method: 'POST', body: JSON.stringify({ amount: sign * n, note }),
    });
    say('ব্যালেন্স আপডেট হয়েছে');
    loadUsers();
  } catch (e) { handleErr(e); }
}

async function ban(id) {
  try { await api(`/api/admin/ban/${id}`, { method: 'POST' }); loadUsers(); } catch (e) { handleErr(e); }
}
async function unban(id) {
  try { await api(`/api/admin/unban/${id}`, { method: 'POST' }); loadUsers(); } catch (e) { handleErr(e); }
}

// ---------- টুর্নামেন্ট ----------

async function loadCategories() {
  try {
    const cats = await api('/api/admin/categories');
    $('tCat').innerHTML = cats.map(c => `<option value="${Number(c.id)}">${esc(c.name)}</option>`).join('');
  } catch (e) { handleErr(e); }
}

async function loadTournaments() {
  try {
    tourneys = await api('/api/admin/tournaments');
    $('tourList').innerHTML = tourneys.map(t => `
      <div class="card">
        <b>${esc(t.name)}</b><br>
        ${esc(t.match_type || '')} · ${esc(t.map_name || '')} · স্লট ${Number(t.joined)}/${Number(t.max_slots)}<br>
        ফি ৳${Number(t.entry_fee)} · প্রতি কিল ৳${Number(t.per_kill)} · প্রাইজ ${esc(t.prize || '-')}<br>
        সময়: ${esc(fmtTime(t.starts_at))} · স্ট্যাটাস: ${esc(t.status)}<br>
        রুম: ${t.room_released ? `<b>প্রকাশিত</b> (${esc(t.room_id || '-')} / ${esc(t.room_password || '-')})` : 'লুকানো'}<br>
        <button class="small" onclick="editTournament(${Number(t.id)})">এডিট</button>
        ${t.room_released
          ? `<button class="small grey" onclick="setRoom(${Number(t.id)}, false)">রুম লুকান</button>`
          : `<button class="small ok" onclick="setRoom(${Number(t.id)}, true)">রুম প্রকাশ</button>`}
        <button class="small danger" onclick="deleteTournament(${Number(t.id)})">মুছুন</button>
      </div>`).join('') || '<p>কোনো টুর্নামেন্ট নেই</p>';
  } catch (e) { handleErr(e); }
}

function readTForm() {
  return {
    name: $('tName').value,
    category_id: $('tCat').value,
    match_type: $('tType').value,
    map_name: $('tMap').value,
    max_slots: $('tSlots').value,
    per_kill: $('tKill').value,
    entry_fee: $('tFee').value,
    prize: $('tPrize').value,
    starts_at: $('tStart').value || null,
    image_url: $('tImg').value,
    status: $('tStatus').value,
  };
}

async function saveTournament() {
  const body = JSON.stringify(readTForm());
  try {
    if (editId) {
      await api(`/api/admin/tournaments/${editId}`, { method: 'PUT', body });
      say('টুর্নামেন্ট আপডেট হয়েছে');
    } else {
      await api('/api/admin/tournaments', { method: 'POST', body });
      say('টুর্নামেন্ট যোগ হয়েছে');
    }
    resetTForm();
    loadTournaments();
  } catch (e) { handleErr(e); }
}

function editTournament(id) {
  const t = tourneys.find(x => Number(x.id) === Number(id));
  if (!t) return;
  editId = t.id;
  $('tFormTitle').textContent = 'এডিট: ' + t.name;
  $('tName').value = t.name;
  $('tCat').value = t.category_id || '';
  $('tType').value = t.match_type || '';
  $('tMap').value = t.map_name || '';
  $('tSlots').value = t.max_slots;
  $('tKill').value = t.per_kill;
  $('tFee').value = t.entry_fee;
  $('tPrize').value = t.prize || '';
  $('tStart').value = t.starts_at ? String(t.starts_at).slice(0, 16) : '';
  $('tImg').value = t.image_url || '';
  $('tStatus').value = t.status;
  $('tSave').textContent = 'আপডেট করুন';
  $('tCancel').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetTForm() {
  editId = null;
  $('tFormTitle').textContent = 'নতুন টুর্নামেন্ট';
  ['tName','tType','tPrize','tImg','tKill','tFee','tStart'].forEach(i => $(i).value = '');
  $('tMap').value = 'Bermuda';
  $('tSlots').value = '48';
  $('tStatus').value = 'open';
  $('tSave').textContent = 'যোগ করুন';
  $('tCancel').classList.add('hidden');
}

async function setRoom(id, release) {
  const t = tourneys.find(x => Number(x.id) === Number(id));
  let roomId = t ? t.room_id || '' : '';
  let pass = t ? t.room_password || '' : '';
  if (release) {
    roomId = prompt('রুম আইডি:', roomId);
    if (roomId === null) return;
    pass = prompt('রুম পাসওয়ার্ড:', pass);
    if (pass === null) return;
    if (!roomId.trim()) { say('রুম আইডি দিন'); return; }
  }
  try {
    await api(`/api/admin/tournaments/${id}/room`, {
      method: 'PUT',
      body: JSON.stringify({ room_id: roomId, room_password: pass, release }),
    });
    say(release ? 'রুম প্রকাশ হয়েছে, জয়েন করা ইউজার দেখতে পাবে' : 'রুম লুকানো হয়েছে');
    loadTournaments();
  } catch (e) { handleErr(e); }
}

async function deleteTournament(id) {
  if (!confirm('এই টুর্নামেন্ট মুছে ফেলবেন?')) return;
  try {
    await api(`/api/admin/tournaments/${id}`, { method: 'DELETE' });
    say('মুছে ফেলা হয়েছে');
    loadTournaments();
  } catch (e) { handleErr(e); }
}

// ---------- সেটিংস ----------

async function loadSettingsForm() {
  try {
    const s = await fetch(API + '/api/settings', { cache: 'no-store' }).then(r => r.json());
    $('sTitle').value = s.app_title || '';
    $('sWelcome').value = s.welcome_text || '';
    $('sBkash').value = s.bkash_number || '';
    $('sNagad').value = s.nagad_number || '';
    $('sRocket').value = s.rocket_number || '';
  } catch {}
}

async function saveSettings(keys) {
  const map = {
    app_title: $('sTitle'), welcome_text: $('sWelcome'),
    bkash_number: $('sBkash'), nagad_number: $('sNagad'), rocket_number: $('sRocket'),
  };
  const body = {};
  keys.forEach(k => body[k] = map[k].value.trim());
  try {
    await api('/api/admin/settings', { method: 'PUT', body: JSON.stringify(body) });
    say('সেটিংস সেভ হয়েছে');
  } catch (e) { handleErr(e); }
}

// ---------- শুরু ----------

if (adminToken) showDash(); else wake();
</script>
